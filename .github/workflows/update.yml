name: Update prices and publish dashboard

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    # Every hour at minute 23 (UTC and JST); avoid high-load minute 00.
    - cron: '23 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-watch-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install market-data packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Refresh prices and fund NAV
        run: python scripts/update_prices.py

      - name: Store last-good snapshot in repo for outage fallback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/market.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: hourly price snapshot [skip ci]'
            git push || echo 'NOTE: Could not persist snapshot to branch; continuing Pages deployment.'
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload published website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
